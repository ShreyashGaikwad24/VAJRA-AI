services:
  postgres:
    image: postgres:17
    container_name: safe-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: safe_ai
      POSTGRES_USER: safe_ai
      POSTGRES_PASSWORD: safe_ai_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safe_ai -d safe_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    env_file:
      - ./frontend/.env.example

  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://safe_ai:safe_ai_dev_password@postgres:5432/safe_ai
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: